<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
  <header class="info-block">
    <img src="./eisenhower-matrix.jpg" alt="matrix-pic">
    <a 
    class="header__link" 
    href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?
    </a>
  </header>
  <section class="todo-block">
    <p id="add-item">
        <label for="new-task">Add Item</label>
        <div class="task-wrapper">
            <input 
              id="new-task"
              class="list__task" 
              type="text">
            <button>Add</button>
        </div>
   </p>
   <h3 class="header">Todo</h3>
   <ul class="incomplete-task list">
     <li class="incomplete-task__item">
        <input type="checkbox" class="incomplete-task__checkbox">
        <label class="list__task">Pay Bills</label>
        <input type="text" class="list__task__input">
        <button class="list__edit">Edit</button>
        <button class="list__delete">
            <img src="./remove.svg" alt="remove-button">
        </button>
     </li>
     <li class="edit-mode incomplete-task__item">
        <input type="checkbox" class="incomplete-task__checkbox">
        <label class="list__task">Go Shopping</label>
        <input 
          type="text" 
          value="Go Shopping" 
          class="list__task__input">
        <button class="list__edit">Save</button>
        <button class="list__delete">
            <img src="./remove.svg" alt="remove-button">
        </button>
     </li>
  </ul>
  <h3 class="header">Completed</h3>
  <ul class="completed-task list">
    <li class="completed-task__item"><input class="incomplete-task__checkbox" type="checkbox" checked>
        <label class="list__task">See the Doctor</label>
        <input type="text" class="list__task__input">
        <button class="list__edit">Edit</button>
        <button class="list__delete">
            <img src="./remove.svg" alt="remove-button">
        </button>
    </li>
  </ul>
  </section>
<script SRC="app.js"></script>
</body>
</html>
